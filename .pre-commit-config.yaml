exclude: |
  (?x)^(
      .*cache.*/.*|       # Exclude cache directories
      .*venv.*/.*|        # Exclude virtual environment directories
      scripts/deprecated_.*/.*  # Kept for history only, never run again
  )$
fail_fast: true
default_language_version:
  python: python3.12
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  #
  # Based on: https://gatlenculp.github.io/gatlens-opinionated-template/precommit/
  # Trimmed down to the tooling this repo (a Flask/SQLAlchemy app, no JS,
  # Markdown, SQL files, notebooks, or Makefile) actually needs.
  #
  # ---------------------------------------------------------------------------- #
  #                              🔄 Pre-Commit Hooks                             #
  # ---------------------------------------------------------------------------- #

  # ----------------------------- 🔒 Security Tools ---------------------------- #

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
        name: "🔒 security · Detect hardcoded secrets"

  # --------------------------- 🔍 Code Quality Tools -------------------------- #

  ### Python Tools ###
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff-format
        name: "🐍 python · Format with Ruff"
      # STRICT
      - id: ruff
        name: "🐍 python · Lint and perform safe auto-fixes with Ruff"
        args: [--fix]

  # STRICT
  # - repo: https://github.com/RobertCraigie/pyright-python
  #   rev: v1.1.391
  #   hooks:
  #     - id: pyright
  #       name: "🐍 python · Check types"

  # ---------------------------- 📁 Filesystem Tools --------------------------- #

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Filesystem Checks
      - id: check-executables-have-shebangs
        name: "📁 filesystem/⚙️ exec · Verify shebang presence"
      - id: check-shebang-scripts-are-executable
        name: "📁 filesystem/⚙️ exec · Verify script permissions"
      - id: check-case-conflict
        name: "📁 filesystem/📝 names · Check case sensitivity"
      - id: check-illegal-windows-names
        name: "📁 filesystem/📝 names · Validate Windows filenames"
      - id: check-symlinks
        name: "📁 filesystem/🔗 symlink · Check symlink validity"
      - id: destroyed-symlinks
        name: "📁 filesystem/🔗 symlink · Detect broken symlinks"
      # ------------------------------- 🌳 Git Tools ------------------------------- #
      - id: check-merge-conflict
        name: "🌳 git · Detect conflict markers"
      - id: forbid-new-submodules
        name: "🌳 git · Prevent submodule creation"
      - id: check-added-large-files
        name: "🌳 git · Block large file commits"
        args: ["--maxkb=5000"]
#      - id: no-commit-to-branch
#        alias: protect-main
#        name: "🌳 git · Protect main branches"
#        args: ["--branch", "main", "--branch", "master"]

  # ---------------------------------------------------------------------------- #
  #                            📝 Commit Message Hooks                           #
  # ---------------------------------------------------------------------------- #
  #
  # --------------------------- ✍️ Git Commit Quality -------------------------- #

  ### Commit Message Standards ###
#  - repo: https://github.com/commitizen-tools/commitizen
#    rev: v4.1.0
#    hooks:
#      - id: commitizen
#        name: "🌳 git · Validate commit message"
#        stages: [commit-msg]
#        additional_dependencies: [cz-conventional-gitmoji]

  # ---------------------------------------------------------------------------- #
  #                             🧪 Fast Tests (Local)                            #
  # ---------------------------------------------------------------------------- #
  # These run inside the project's Pipenv environment (`pipenv install --dev`),
  # so they work without first running `pipenv shell`. CI skips them because
  # the Tests workflow runs the suite on its own.
  - repo: local
    hooks:
      - id: pytest-collect
        name: "🧪 test · Validate test formatting"
        entry: pipenv run pytest tests --collect-only -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: pytest-fast
        name: "🧪 test · Run unit tests"
        entry: pipenv run pytest tests -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

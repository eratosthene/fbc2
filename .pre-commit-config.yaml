exclude: |
  (?x)^(
      .*cache.*/.*|       # Exclude cache directories
      .*venv.*/.*|        # Exclude virtual environment directories
      scripts/deprecated_.*/.*  # Kept for history only, never run again
  )$
fail_fast: true
default_language_version:
  python: python3.12
# The quick checks run on each commit, the test suite on each push.
default_install_hook_types:
  - pre-commit
  - pre-push
# Hooks that don't name a stage run on commit only, not again on push.
default_stages: [pre-commit]
repos:
  #
  # Based on: https://gatlen.me/gatlens-opinionated-template/pre-commit/
  # Trimmed down to the tooling this repo (a Flask/SQLAlchemy app, no JS,
  # SQL files, notebooks, or Makefile) actually needs.
  #
  # ---------------------------------------------------------------------------- #
  #                              🔄 Pre-Commit Hooks                             #
  # ---------------------------------------------------------------------------- #

  # ----------------------------- 🔒 Security Tools ---------------------------- #

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
        name: "🔒 security · Detect hardcoded secrets"

  # --------------------------- 🔍 Code Quality Tools -------------------------- #

  ### Python Tools ###
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff-format
        name: "🐍 python · Format with Ruff"
      # STRICT
      - id: ruff
        name: "🐍 python · Lint and perform safe auto-fixes with Ruff"
        args: [--fix]

  # STRICT
  # - repo: https://github.com/RobertCraigie/pyright-python
  #   rev: v1.1.391
  #   hooks:
  #     - id: pyright
  #       name: "🐍 python · Check types"

  ### Data & Config Validation ###
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.31.0
    hooks:
      - id: check-github-workflows
        name: "🐙 github-actions · Validate gh workflow files"
        args: ["--verbose"]

  ### Markdown ###
  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.21
    hooks:
      - id: mdformat
        name: "📝 markdown · Format markdown"
        # Numbers lists 1, 2, 3 rather than 1, 1, 1, so they read as steps
        # in the file as well as on GitHub.
        args: ["--number"]
        additional_dependencies:
          - mdformat-gfm

  # ---------------------------- 📁 Filesystem Tools --------------------------- #

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Filesystem Checks
      - id: check-executables-have-shebangs
        name: "📁 filesystem/⚙️ exec · Verify shebang presence"
      - id: check-shebang-scripts-are-executable
        name: "📁 filesystem/⚙️ exec · Verify script permissions"
      - id: check-case-conflict
        name: "📁 filesystem/📝 names · Check case sensitivity"
      - id: check-illegal-windows-names
        name: "📁 filesystem/📝 names · Validate Windows filenames"
      - id: check-symlinks
        name: "📁 filesystem/🔗 symlink · Check symlink validity"
      - id: destroyed-symlinks
        name: "📁 filesystem/🔗 symlink · Detect broken symlinks"
      # ------------------------------- 🌳 Git Tools ------------------------------- #
      - id: check-merge-conflict
        name: "🌳 git · Detect conflict markers"
      - id: forbid-new-submodules
        name: "🌳 git · Prevent submodule creation"
      - id: check-added-large-files
        name: "🌳 git · Block large file commits"
        args: ["--maxkb=5000"]
#      - id: no-commit-to-branch
#        alias: protect-main
#        name: "🌳 git · Protect main branches"
#        args: ["--branch", "main", "--branch", "master"]

  # ---------------------------------------------------------------------------- #
  #                            📝 Commit Message Hooks                           #
  # ---------------------------------------------------------------------------- #
  #
  # --------------------------- ✍️ Git Commit Quality -------------------------- #

  ### Commit Message Standards ###
  # Turning this on needs commit-msg back in default_install_hook_types.
#  - repo: https://github.com/commitizen-tools/commitizen
#    rev: v4.1.0
#    hooks:
#      - id: commitizen
#        name: "🌳 git · Validate commit message"
#        stages: [commit-msg]
#        additional_dependencies: [cz-conventional-gitmoji]

  # ---------------------------------------------------------------------------- #
  #                              🧪 Tests (Local)                                #
  # ---------------------------------------------------------------------------- #
  # The whole suite takes about 40 seconds, so it runs before each push rather
  # than each commit. It runs inside the project's Pipenv environment
  # (`pipenv install --dev`), so it works without first running `pipenv shell`.
  # CI's `pre-commit run` only runs the commit stage; the Tests workflow runs
  # the suite on its own.
  - repo: local
    hooks:
      - id: pytest
        name: "🧪 test · Run unit tests"
        entry: pipenv run pytest tests -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

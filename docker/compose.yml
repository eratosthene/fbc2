# The live server's container. Run from the repo root, after docker/build.sh:
#
#   sudo docker compose -f docker/compose.yml up -d
#
# Settings aren't in the image: config.py is mounted from the repo root, and
# docker/.env, next to this file, can override any of them with
# FBC_CONFIG_<KEY> variables (see "Settings from the
# environment" in docs/production.md). A change to
# either needs the container recreated, not a rebuild: `docker/live-up.sh
# -n`. Paths here are relative to this file's folder, docker/.
#
# Which image runs is FBC_IMAGE in docker/.env, which docker/live-deploy.sh
# sets to an image CI published (see docs/deploy.md). Without it, this runs the
# fbc2:latest that docker/build.sh builds.
name: fbc2

services:
  fbc:
    image: ${FBC_IMAGE:-fbc2:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Required: the live server's Compose (2.20) can't make it optional. An
    # empty one is fine; docker/live-up.sh makes one if it's missing.
    env_file: .env
    volumes:
      - type: bind
        source: ../config.py
        target: /app/config.py
        read_only: true
        # Fail if it's missing, rather than make an empty folder in its place.
        bind:
          create_host_path: false
    ports:
      - "20000:20000"
    # Healthy once the entrypoint's `flask setup-db` has finished and the app
    # answers, which docker/live-deploy.sh waits for. The start period is long
    # because the live server's disk is slow to make tables.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:20000/login/', timeout=5)
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

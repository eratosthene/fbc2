# A local testing session: the app, run from this checkout's code by Flask's
# reloading dev server, against a MariaDB like the live server's. See
# "Testing with Docker" in docs/development.md.
#
#   dev-scripts/compose-up.sh   (docker compose -f docker/compose.dev.yml up --build)
#
# It needs FBC_DEV_DB_PASSWORD in docker/.env, next to this file, and uses
# config.py for everything but the database. Paths here are relative to this
# file's folder, docker/. Both ports are on 127.0.0.1 only, since the
# database may hold a copy of live data.
name: fbc2-dev

services:
  db:
    image: mariadb:10.11
    # The live database's character set, so tables new migrations create
    # match the ones in a dump; foreign keys between string columns need it.
    command:
      - --character-set-server=utf8mb3
      - --collation-server=utf8mb3_general_ci
    environment:
      MARIADB_DATABASE: fbc
      MARIADB_USER: fbc
      MARIADB_PASSWORD: ${FBC_DEV_DB_PASSWORD:?Set FBC_DEV_DB_PASSWORD in docker/.env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
      # Any .sql or .sql.gz dumps in docker/dev-db are loaded the first time,
      # into an empty volume. See "A copy of live data"
      # in docs/development.md.
      - ./dev-db:/docker-entrypoint-initdb.d:ro
    # 3307 so it doesn't clash with a MariaDB or MySQL already on 3306, and
    # so `flask run` on this machine can use it too.
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Loading a dump the first time can take a few minutes.
      start_period: 10m

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: fbc2:dev
    depends_on:
      db:
        condition: service_healthy
    # As on the live server, any FBC_CONFIG_<KEY> in docker/.env overrides
    # that setting in config.py (see fbc/settings.py).
    env_file: .env
    environment:
      # config.py uses this in place of its own SQLALCHEMY_DATABASE_URI.
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://fbc:${FBC_DEV_DB_PASSWORD}@db/fbc
      # Dev mode (see fbc/devmode.py), so a copy of live data can't reach the
      # live eBay and Discogs accounts. FBC_DEV_MODE=0 in docker/.env turns it
      # off, unless config.py sets DEV_MODE = True.
      FBC_DEV_MODE: ${FBC_DEV_MODE:-1}
    # Mounted rather than baked in, so edits show up without a rebuild. The
    # entrypoint still runs `flask setup-db` first, as on the live server.
    volumes:
      - ../config.py:/app/config.py:ro
      - ../fbc:/app/fbc
      - ../migrations:/app/migrations
      - ../dev-scripts:/app/dev-scripts:ro
    command: ["flask", "run", "--debug", "--host", "0.0.0.0", "--port", "5555"]
    ports:
      - "127.0.0.1:5555:5555"

volumes:
  db:

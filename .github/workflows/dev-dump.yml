name: Dev dump

# Runs scripts/dump_for_dev.py against MariaDB 10.11, as on the live server,
# with tokens, users and buyers seeded in, and checks the dump it makes has
# none of them and loads into an empty database the app can use.
on:
  pull_request:
    paths:
      - scripts/dump_for_dev.py
      - .github/workflows/dev-dump.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: fbc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      FLASK_APP: fbc
      MYSQL: mariadb -h 127.0.0.1 -uroot -proot
      # The live database's character set. Foreign keys between string
      # columns need tables to match it.
      CHARSET: CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci
      # As root, to build and seed the database; the script gets the fbc user.
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://root:root@127.0.0.1/fbc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pipenv

      - name: Install dependencies from Pipfile.lock
        run: |
          python -m pip install pipenv
          pipenv install --dev --deploy

      # The runner comes with MySQL's client; the script needs MariaDB's, as
      # on the live server.
      - name: Install the MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          mariadb-dump --version

      - name: Use config.py.tpl as config.py
        run: cp config.py.tpl config.py

      # A user like the live one, which can't create databases, the dump-only
      # user README.md sets up, and a row in every table the dump has to
      # empty.
      - name: Set up and seed the database
        run: |
          $MYSQL -e "ALTER DATABASE fbc $CHARSET"
          pipenv run flask setup-db
          pipenv run flask fab create-admin --username admin --firstname A \
            --lastname Dmin --email admin@example.com --password ci-password
          $MYSQL fbc <<'SQL'
          CREATE USER 'fbc'@'%' IDENTIFIED BY 'fbc';
          GRANT SELECT, INSERT, UPDATE, DELETE, SHOW VIEW, TRIGGER, LOCK TABLES
              ON fbc.* TO 'fbc'@'%';
          CREATE USER 'fbc_dump'@'%' IDENTIFIED BY 'fbc_dump';
          GRANT ALL PRIVILEGES ON `fbc_dev_scrub`.* TO 'fbc_dump'@'%';
          INSERT INTO ebay_oauth_token (refresh_token)
              VALUES ('v^1.1#i^1#ci-ebay-refresh-token');
          INSERT INTO discogs_oauth_token (token, secret)
              VALUES ('ci-discogs-token', 'ci-discogs-secret');
          -- Flask-AppBuilder's ids come from sequences on MariaDB.
          INSERT INTO ab_api_key
              (id, uuid, name, key_hash, lookup_hash, key_prefix, user_id, active)
              SELECT NEXTVAL(ab_api_key_id_seq), 'ci-api-key-uuid', 'ci',
                     'ci-api-key-hash', 'ci-api-key-lookup', 'ci', id, 1
              FROM ab_user;
          INSERT INTO ab_register_user
              (id, first_name, last_name, username, email, password)
              VALUES (NEXTVAL(ab_register_user_id_seq), 'Pending', 'User',
                      'pending', 'pending@example.com', 'ci-pending-hash');
          INSERT INTO ebay_listing (item_id, title) VALUES ('1001', 'A record');
          INSERT INTO ebay_order (order_id, created_time, buyer, title, ebay_listing_id) VALUES
              ('1-1', '2026-01-01', 'ci_buyer_bob', 'A record', '1001'),
              ('1-2', '2026-01-02', 'ci_buyer_alice', 'A record', '1001'),
              ('1-3', '2026-01-03', 'ci_buyer_bob', 'A record', '1001'),
              ('1-4', '2026-01-04', NULL, 'A record', '1001');
          SQL

      # Run with the runner's Python, without the app's packages, as on the
      # live server.
      - name: Without --admin-user, it fails and leaves nothing behind
        env:
          SQLALCHEMY_DATABASE_URI: mysql+pymysql://fbc:fbc@127.0.0.1/fbc
        run: |
          if python scripts/dump_for_dev.py -o dumps; then
            echo "It should have failed: fbc can't create the scratch database."
            exit 1
          fi
          test -z "$(ls -A dumps)"
          test -z "$($MYSQL -N -e "SHOW DATABASES LIKE 'fbc_dev_scrub'")"

      - name: Make the dump
        env:
          SQLALCHEMY_DATABASE_URI: mysql+pymysql://fbc:fbc@127.0.0.1/fbc
        run: |
          echo fbc_dump | python scripts/dump_for_dev.py -o dumps --admin-user fbc_dump
          ls -l dumps
          test -z "$($MYSQL -N -e "SHOW DATABASES LIKE 'fbc_dev_scrub'")"

      - name: The dump has no tokens, users or buyers
        run: |
          dump=$(ls dumps/fbc-dev-*.sql.gz)
          if zgrep -E "ci-|ci_buyer|example.com|INSERT INTO \`(ab_user|ab_user_role|ab_api_key|ab_register_user|ebay_oauth_token|discogs_oauth_token)\`" "$dump"; then
            echo "The dump has something it shouldn't."
            exit 1
          fi
          zgrep -q "CREATE TABLE \`ebay_oauth_token\`" "$dump"
          if zgrep -E "^(CREATE DATABASE|USE )" "$dump"; then
            echo "The dump should load into whichever database it's given."
            exit 1
          fi

      - name: The dump loads into an empty database and the app can use it
        env:
          SQLALCHEMY_DATABASE_URI: mysql+pymysql://root:root@127.0.0.1/fbc_loaded
        run: |
          $MYSQL -e "CREATE DATABASE fbc_loaded $CHARSET"
          zcat dumps/fbc-dev-*.sql.gz | $MYSQL fbc_loaded
          pipenv run flask setup-db
          pipenv run flask db check
          test "$($MYSQL -N fbc_loaded -e "SELECT COUNT(*) FROM ab_user")" = 0
          test "$($MYSQL -N fbc_loaded -e "SELECT COUNT(*) FROM ab_role")" != 0
          buyers=$($MYSQL -N fbc_loaded -e \
            "SELECT GROUP_CONCAT(IFNULL(buyer, '-') ORDER BY order_id) FROM ebay_order")
          echo "Buyers: $buyers"
          test "$buyers" = "buyer-1,buyer-2,buyer-1,-"
          pipenv run flask fab create-admin --username dev --firstname D \
            --lastname Ev --email dev@example.com --password dev-password

name: Docker build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # config.py holds real credentials and isn't committed. The Dockerfile
      # copies it into the image, so build with the template in its place.
      - name: Use config.py.tpl as config.py
        run: cp config.py.tpl config.py

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          # A path context, so the config.py copied above is included.
          context: .
          push: false
          load: true
          tags: fbc2:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app (and the entrypoint's `flask setup-db`) needs a database,
      # so skip the entrypoint and just check the packages it runs on are
      # installed and importable in the image.
      - name: Check the image's packages import
        id: smoke
        run: >-
          docker run --rm --entrypoint python fbc2:ci -c
          "import flask_appbuilder, flask_migrate, gunicorn, pymysql, discogs_client, ebaysdk, PIL, dotenv"

      - name: Get image size
        id: size
        if: steps.build.outcome == 'success'
        run: |
          bytes=$(docker image inspect fbc2:ci --format '{{.Size}}')
          echo "mb=$((bytes / 1024 / 1024))" >> "$GITHUB_OUTPUT"

      # In the PR description rather than a comment, so it doesn't email
      # everyone on the PR (see .github/scripts/pr-section.js).
      - name: Add the results to the PR description
        if: >-
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/github-script@v9
        env:
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          SIZE_MB: ${{ steps.size.outputs.mb }}
        with:
          script: |
            const { BUILD, SMOKE, SIZE_MB } = process.env;
            const ok = BUILD === "success" && SMOKE === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              `### ${ok ? "✅" : "❌"} Docker build ${ok ? "passed" : "failed"}`,
              "",
              "| Step | Result |",
              "| --- | --- |",
              `| Build image | ${BUILD} |`,
              `| Packages import | ${SMOKE || "skipped"} |`,
              SIZE_MB ? `| Image size | ${SIZE_MB} MB |` : null,
              "",
              `Commit ${sha} · [workflow run](${runUrl})`,
            ].filter((line) => line !== null).join("\n");

            const prSection = require("./.github/scripts/pr-section.js");
            await prSection({ github, context, core }, "fbc2-docker-build", body);

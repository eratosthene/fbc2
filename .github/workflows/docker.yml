name: Docker build

# Only what goes into the image, or builds and checks it: see the COPY lines in
# docker/Dockerfile and docker/Dockerfile.dockerignore. A change to docs, tests,
# scripts or the other workflows builds nothing and publishes nothing. If the
# Dockerfile copies something new, add it here.
on:
  pull_request:
    paths:
      - Pipfile
      - Pipfile.lock
      - fbc/**
      - migrations/**
      - docker/Dockerfile
      - docker/Dockerfile.dockerignore
      - docker/docker-entrypoint.sh
      - .github/scripts/image-smoke.sh
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Pipfile
      - Pipfile.lock
      - fbc/**
      - migrations/**
      - docker/Dockerfile
      - docker/Dockerfile.dockerignore
      - docker/docker-entrypoint.sh
      - .github/scripts/image-smoke.sh
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: fbc2:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image's packages import
        id: smoke
        run: .github/scripts/image-smoke.sh fbc2:ci

      - name: Get image size
        id: size
        if: steps.build.outcome == 'success'
        run: |
          bytes=$(docker image inspect fbc2:ci --format '{{.Size}}')
          echo "mb=$((bytes / 1024 / 1024))" >> "$GITHUB_OUTPUT"

      # In the PR description rather than a comment, so it doesn't email
      # everyone on the PR (see .github/scripts/pr-section.js).
      - name: Add the results to the PR description
        if: >-
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/github-script@v9
        env:
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          SIZE_MB: ${{ steps.size.outputs.mb }}
        with:
          script: |
            const { BUILD, SMOKE, SIZE_MB } = process.env;
            const ok = BUILD === "success" && SMOKE === "success";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              `### ${ok ? "✅" : "❌"} Docker build ${ok ? "passed" : "failed"}`,
              "",
              "| Step | Result |",
              "| --- | --- |",
              `| Build image | ${BUILD} |`,
              `| Packages import | ${SMOKE || "skipped"} |`,
              SIZE_MB ? `| Image size | ${SIZE_MB} MB |` : null,
              "",
              `Commit ${sha} · [workflow run](${runUrl})`,
            ].filter((line) => line !== null).join("\n");

            const prSection = require("./.github/scripts/pr-section.js");
            await prSection({ github, context, core }, "fbc2-docker-build", body);

  # Publishes the image prod runs (see docs/deploy.md). Only for a push to
  # main, so it does nothing on pull requests, and only once the build and
  # smoke check above passed. The `main` tag moves only after the pushed image
  # itself has passed the same check.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # linux/amd64 only: the live server's CPU. No provenance attestation,
      # which makes the image an index that older Docker versions may not
      # read. The source label ties the package to this repository.
      - name: Build and push the commit's tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            fbc2.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the pushed image
        run: |
          docker pull "$IMAGE:${{ steps.tag.outputs.sha }}"
          .github/scripts/image-smoke.sh "$IMAGE:${{ steps.tag.outputs.sha }}"

      - name: Move the main tag to it
        run: |
          docker buildx imagetools create -t "$IMAGE:main" \
            "$IMAGE:${{ steps.tag.outputs.sha }}"
